# Points the storage-node image's :latest, which home operators run, at an
# image the Build workflow made from a commit on main, when no node release
# moves it (release.yml moves it, forward only, when a release is published):
#
# - an image release: a new image with the node release :latest already
#   has, such as one with a new node manager. The nodes' own upgrades
#   replace only their binary, so operators get the rest of the image only
#   by pulling it.
# - a withdrawal: :latest back to an image it held before. The withdrawn
#   release is deleted on GitHub first, so nodes still waiting to install
#   it drop it, and its Release run can't move :latest to it again.
#
# Run by hand from main, with the commit and the digest its Build run
# recorded, withdraw set for a withdrawal, node_code when the node's code
# changed since its release, and, in a withdrawal alone, allow_unmarked to
# take :latest from an image with an image marker to one with none (all
# below):
#
#   gh workflow run latest.yml --ref main -f commit=<commit> -f digest=sha256:<digest>
#
# Runs of this workflow and release.yml share one concurrency group, which
# keeps one run going and at most one waiting: a run queued while one is
# waiting cancels the waiting one. That happens as the run is queued,
# before any of its jobs starts, so nothing in either workflow can stop it.
# So dispatch only when these list no run, queued, waiting or in progress:
#
#   gh run list --workflow release.yml --json databaseId,status --jq '.[] | select(.status != "completed")'
#   gh run list --workflow latest.yml --json databaseId,status --jq '.[] | select(.status != "completed")'
#
# Approve or reject a run waiting for its approval before pushing a release
# tag (until then it holds the group), and re-run a cancelled run with
# `gh run rerun <id>`.
#
# The checks job, which can write nothing, runs scripts/check-workflows.sh
# on the commit this workflow runs from: main's head when it was dispatched,
# which can be later than the commit given. It checks that the run is from
# main, that the latest environment, where the latest job runs, asks for an
# approval by exactly one required reviewer, the user REVIEWER names, that
# the commit is on main, that the commit's Build run from
# its push to main succeeded, smoke test included, and so did its newest
# Test run, and that the digest is the image that Build run pushed: by the
# build provenance attestation the run made for it, by the run's
# storage-node-digest artifact while that is kept (30 days), or, for a
# withdrawal, by docker/release-images, which records the image each
# release put on :latest before the Build workflow attested its images; an
# image with none of these is refused. A run without withdraw needs the
# attestation, the one record of a new image that doesn't expire, so a
# later withdrawal can always go back to it. The image's node must be a published
# release, which the latest job checks again after the approval, as a
# release can be withdrawn while a run waits for it. It is the Build workflow's own build of the commit, as in every
# release image, checked only by the version it reports, so node code
# changed since that release's tag without a version bump would ship under
# its version: any such change is refused unless node_code names it, by
# the fingerprint the refusal prints, which covers that change alone, and
# the run's summary lists the changes. The compiler is one of those paths:
# rust-toolchain.toml pins the exact Rust release every workflow builds
# with, so an image's node is built with its release's compiler. A withdrawal needs no node_code: its
# image was on :latest before, a release's image built from the release's
# own commit or one a Latest run moved :latest to. A node takes the image's
# binary only when it is newer than its own, so the binary of an image
# release goes only to new nodes, and existing nodes keep their signed
# release binary. For a withdrawal, the checks job also checks that :latest
# held the image before: an earlier Latest run moved :latest to that
# digest, or it is the image of a v*+ds.* tag on the commit whose Release
# run succeeded. It also reads, from those runs, the images :latest held
# with the image's node since that node's release, in order, for the latest
# job's check that a withdrawal to the same node goes back one image.
#
# The latest job then runs in the latest environment, after its approval,
# given in GitHub's interface by a required reviewer. It refuses an image
# whose node is newer than the one :latest has, which goes to :latest only
# with its release, and, unless the run is a withdrawal, one whose node is
# older, or that was built from a commit before the one :latest's image was
# built from: withdraw is needed for any move to an older image. It refuses
# a move from an image with an image marker (/opt/ant/image-version, which
# every image with darwin-nodes as its node manager carries) to one with
# none, whose node manager is Autonomi's, unless the run is a withdrawal
# and allow_unmarked is set: only withdrawing the first image release
# needs that. A withdrawal goes back one step, never further: to an older
# node only once the withdrawn release is gone and the image's release is
# then the newest published one, and to the same node only to the image
# :latest had before the one it has. It checks again
# that the image's node is a published release. It writes
# the digest :latest had and the new one to the run's summary, with the
# command that moves it back when the image it had has a record that
# doesn't expire, then moves :latest and checks it. The latest environment
# holds no secret and admits only main; the release environment, which
# holds the release signing key, admits only release.yml's runs from
# v*+ds.* tags.
#
# scripts/check-workflows.sh, which the Build and Test workflows and the
# checks job below run, fails if this file loses any of that.

name: Latest

# The digest first: a withdrawal's check below matches earlier runs by it.
run-name: ${{ inputs.withdraw && 'Withdraw latest to ' || 'Point latest at ' }}${{ inputs.digest }} from ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit on main whose image the latest tag gets (40 hex digits)
        required: true
        type: string
      digest:
        description: That image's digest, as the commit's Build run recorded it (sha256:...)
        required: true
        type: string
      withdraw:
        description: A withdrawal, which may move the latest tag back to an image it had before
        type: boolean
        default: false
      node_code:
        description: The fingerprint of the node's code changes since its release, which a run refusing them prints (64 hex digits)
        type: string
        default: ""
      allow_unmarked:
        description: With withdraw alone, allow moving the latest tag from an image with an image marker to one with none (Autonomi's node manager), as only withdrawing the first image release needs
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

# release.yml's group: a release and this never move :latest at once. It
# keeps at most one run waiting (see above).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # What can be checked before the approval, with nothing that can write.
  # The inputs reach the shell only as environment variables.
  checks:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    outputs:
      run: ${{ steps.build_run.outputs.run }}
      version: ${{ steps.version.outputs.version }}
      held: ${{ steps.held.outputs.held }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/project-dspace/storage-node
      # The one person whose approval moves :latest: the latest
      # environment's only required reviewer.
      REVIEWER: DanielDNewton
      COMMIT: ${{ inputs.commit }}
      DIGEST: ${{ inputs.digest }}
      WITHDRAW: ${{ inputs.withdraw }}
      NODE_CODE: ${{ inputs.node_code }}
    steps:
      - name: Check the ref and the inputs
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::run this workflow from main (--ref main), not $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a full commit: 40 hex digits"
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest must be sha256: and 64 hex digits"
            exit 1
          fi
          if [[ -n "$NODE_CODE" && ! "$NODE_CODE" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::node_code must be empty, or the 64 hex digits a run refusing the node's code changes printed"
            exit 1
          fi

      # The latest job runs in the latest environment, whose approval moves
      # :latest. GitHub makes an environment a job names when there is none,
      # with no protection, so the run is refused unless the environment
      # asks for the approval of one required reviewer, the user REVIEWER
      # names, and no one else (no other user, no team), which
      # administrators can't bypass, and admits only the branch main.
      # prevent_self_review is deliberately not checked: the one reviewer
      # also dispatches the runs, so it has to be off.
      - name: Check the latest environment asks for an approval
        run: |
          environment=$(gh api "repos/$GH_REPO/environments/latest" \
            --jq '[.can_admins_bypass == false, .deployment_branch_policy.custom_branch_policies == true] | all' 2>/dev/null || true)
          reviewers=$(gh api "repos/$GH_REPO/environments/latest" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]? | "\(.type) \(.reviewer.login // .reviewer.slug)"] | join(", ")' 2>/dev/null || true)
          branches=$(gh api "repos/$GH_REPO/environments/latest/deployment-branch-policies" \
            --jq '[.branch_policies[] | "\(.type) \(.name)"] | join(", ")' 2>/dev/null || true)
          if [[ "$environment" != true || "$reviewers" != "User $REVIEWER" || "$branches" != "branch main" ]]; then
            echo "::error::the latest environment must ask for the approval of one required reviewer, the user $REVIEWER, which administrators can't bypass, and admit only the branch main (its rules: ${environment:-no such environment}; its required reviewers: ${reviewers:-none}; the branches it admits: ${branches:-none listed})"
            exit 1
          fi
          echo "- The latest environment asks for the approval of $REVIEWER alone and admits only main." >> "$GITHUB_STEP_SUMMARY"

      # The commit this workflow runs from, with the whole history and every
      # tag, for the node's changes and a withdrawal's tags below.
      - name: Check out the commit this runs from
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # This workflow as it runs, which the commit given doesn't hold when it
      # is older: the check the Build and Test runs of its commit make.
      - name: Check the workflows
        run: bash scripts/check-workflows.sh

      # main is the commit, or ahead of it.
      - name: Check the commit is on main
        run: |
          status=$(gh api "repos/$GH_REPO/compare/$COMMIT...main" --jq .status 2>/dev/null || true)
          if [[ "$status" != ahead && "$status" != identical ]]; then
            echo "::error::$COMMIT is not on main (${status:-not found})"
            exit 1
          fi
          echo "- $COMMIT is on main." >> "$GITHUB_STEP_SUMMARY"

      # The run from the commit's push to main, as release.yml's checks job
      # takes it: a run by hand may reuse another run's node build. Its image
      # job pushed the image only after the smoke test passed.
      - name: Check the commit's Build run
        id: build_run
        run: |
          run=$(gh api -X GET "repos/$GH_REPO/actions/workflows/build.yml/runs" \
            -f head_sha="$COMMIT" -f event=push -f branch=main -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')
          if [[ -z "$run" ]]; then
            echo "::error::no Build run from a push of $COMMIT to main"
            exit 1
          fi
          conclusion=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.conclusion // empty')
          if [[ "$conclusion" != success ]]; then
            echo "::error::Build run $run of $COMMIT ended '${conclusion:-unfinished}', not success"
            exit 1
          fi
          smoke=$(gh api "repos/$GH_REPO/actions/runs/$run/jobs" \
            --jq '[.jobs[] | select(.name == "image") | .steps[] | select(.name == "Smoke test") | .conclusion] | join(" ")')
          if [[ "$smoke" != success ]]; then
            echo "::error::the smoke test of Build run $run ended '${smoke:-not run}', not success"
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "- Build run $run, from the push of $COMMIT to main, succeeded, smoke test included." >> "$GITHUB_STEP_SUMMARY"

      # The newest run of the commit's suite, as release.yml's checks job
      # takes it: from its push to main, or one run by hand without the
      # listings cross-test. tests/darwin_image.rs, which pins every deletion
      # the image's scripts make, runs there.
      - name: Check the commit's Test run
        run: |
          run=$(gh api -X GET "repos/$GH_REPO/actions/workflows/test.yml/runs" \
            -f head_sha="$COMMIT" -f per_page=100 \
            --jq '[.workflow_runs[] | select((.event == "push" and .head_branch == "main") or (.event == "workflow_dispatch" and .display_title == "Test by hand"))] | max_by(.run_number) | .id // empty')
          if [[ -z "$run" ]]; then
            echo "::error::no Test run of $COMMIT from a push to main, or by hand without the listings cross-test: run Test on it, then this workflow"
            exit 1
          fi
          conclusion=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.conclusion // empty')
          if [[ "$conclusion" != success ]]; then
            echo "::error::Test run $run of $COMMIT ended '${conclusion:-unfinished}', not success: once it succeeds, run this workflow again"
            exit 1
          fi
          echo "- Test run $run of $COMMIT succeeded." >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to the registry
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # The digest must be the image the Build run pushed, by a record that
      # run made: the build provenance attestation build.yml's image job
      # makes, which doesn't expire, signed for build.yml on main at the
      # commit, by a run a push started, as its certificate says (GitHub's
      # token sets the certificate; the workflow writes the predicate), and,
      # unless the run is a withdrawal, by the Build run found above, any
      # attempt of it (the certificate's run URI); or
      # the run's storage-node-digest artifact, kept 30 days, which must
      # name the digest while it is kept. An image from before the Build
      # workflow attested its images has the artifact alone; for a
      # withdrawal, docker/release-images, at the commit this workflow runs
      # from, where scripts/check-workflows.sh pins it, also records the
      # image each release put on :latest before then, and the line of a
      # v*+ds.* tag on the commit is taken as a third record. An image with
      # none of them is refused. A run without withdraw also needs the
      # attestation, so the image it puts on :latest has a record that
      # doesn't expire, which a later withdrawal to it needs once the
      # artifact has expired. The summary names the record taken, and so
      # does the step's output, for a withdrawal's check below.
      # storage-node:<commit> is only noted: a later run by hand can push
      # the commit's tag again.
      - name: Check the digest
        id: digest
        env:
          RUN: ${{ steps.build_run.outputs.run }}
        run: |
          if [[ "$WITHDRAW" != true ]]; then
            from_run="https://github.com/$GH_REPO/actions/runs/$RUN/"
            attested_by="by Build run $RUN; its attempt is not compared, since a re-run attempt builds the same commit"
          else
            from_run="https://github.com/$GH_REPO/actions/runs/"
            attested_by="by any Build run of that push, not tied to Build run $RUN, since a withdrawal may go back to an older image of the commit"
          fi
          attested=$({ gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/build.yml" \
            --source-ref refs/heads/main --source-digest "$COMMIT" --format json || true; } \
            | jq -r --arg from "$from_run" '[.[]?.verificationResult.signature.certificate | select(.buildTrigger == "push" and (.runInvocationURI | startswith($from))) | .runInvocationURI] | first // empty' || true)
          kept=$(gh api "repos/$GH_REPO/actions/runs/$RUN/artifacts" \
            --jq '[.artifacts[] | select(.name == "storage-node-digest" and (.expired | not))] | length')
          recorded=""
          if ((kept > 0)); then
            gh run download "$RUN" --name storage-node-digest --dir "$RUNNER_TEMP/digest"
            recorded=$(cat "$RUNNER_TEMP/digest/storage-node-digest.txt")
          fi
          if [[ -n "$recorded" && "$recorded" != "$DIGEST" ]]; then
            echo "::error::Build run $RUN recorded $recorded, not $DIGEST"
            exit 1
          fi
          listed=""
          if [[ "$WITHDRAW" == true ]]; then
            tag=$(awk -v commit="$COMMIT" -v digest="$DIGEST" '!/^#/ && NF == 3 && $2 == commit && $3 == digest { print $1 }' docker/release-images)
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+ds\.[1-9][0-9]*$ && "$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)" == "$COMMIT" ]]; then
              listed=$tag
            fi
          fi
          if [[ -z "$attested" && "$recorded" != "$DIGEST" && -z "$listed" ]]; then
            echo "::error::nothing records $DIGEST as the image Build run $RUN pushed: there is no attestation of it from a push of $COMMIT to main, the run's storage-node-digest artifact has expired, and docker/release-images lists it for no v*+ds.* tag on $COMMIT (taken for a withdrawal alone)"
            exit 1
          fi
          if [[ "$WITHDRAW" != true && -z "$attested" ]]; then
            echo "::error::no attestation by Build run $RUN from the push of $COMMIT to main verifies $DIGEST: an image goes forward to the latest tag only with its attestation, the record that doesn't expire, so a later withdrawal can go back to it once the run's storage-node-digest artifact has expired. Use the image of a later commit on main, whose Build run attests its image"
            exit 1
          fi
          if [[ "$recorded" == "$DIGEST" ]]; then
            record=artifact
          elif [[ -n "$listed" ]]; then
            record=listed
          else
            record=attestation
          fi
          echo "record=$record" >> "$GITHUB_OUTPUT"
          {
            if [[ -n "$attested" ]]; then
              echo "- $DIGEST is attested as built by build.yml from the push of $COMMIT to main ($attested), $attested_by."
            else
              echo "- No attestation from the push of $COMMIT to main verifies $DIGEST (an image from before the Build workflow attested its images)."
            fi
            if [[ -n "$recorded" ]]; then
              echo "- Build run $RUN recorded $DIGEST."
            else
              echo "- Build run $RUN's storage-node-digest artifact has expired."
            fi
            if [[ -n "$listed" ]]; then
              echo "- docker/release-images lists $DIGEST as the image $listed, on $COMMIT, put on :latest."
            fi
            echo "- The record taken: $record."
          } >> "$GITHUB_STEP_SUMMARY"
          tagged=$(docker buildx imagetools inspect "$IMAGE:$COMMIT" --format '{{json .Manifest}}' | jq -r .digest || true)
          if [[ "$tagged" != "$DIGEST" ]]; then
            echo "- $IMAGE:$COMMIT names ${tagged:-no image}, not $DIGEST: a later run pushed the commit's tag again. The digest the records give is used." >> "$GITHUB_STEP_SUMMARY"
          fi

      # As release.yml's latest job reads it; the latest job compares it with
      # the node of the image it replaces. It must be a published release's.
      # The image's node is this commit's own build, checked only by the
      # version it reports, so a change since that release's tag to what the
      # node is built from (paths, below) would ship under its version. Any
      # such change is refused unless node_code names it: the fingerprint of
      # the git object each of those paths has at the tag and at the commit,
      # so it names that change and no other, and the refusal prints it.
      # The summary lists the changes either way. A withdrawal needs none:
      # its image was on :latest before (see the header).
      - name: Read the image's node version
        id: version
        run: |
          version=$(docker run --rm --entrypoint /opt/ant/ant-node "$IMAGE@$DIGEST" --version)
          if [[ ! "$version" =~ ^ant-node\ ([0-9]+\.[0-9]+\.[0-9]+\+ds\.[1-9][0-9]*)$ ]]; then
            echo "::error::$IMAGE@$DIGEST runs '$version', not a release's version (ant-node X.Y.Z+ds.N)"
            exit 1
          fi
          tag="v${BASH_REMATCH[1]}"
          published=$(gh release view "$tag" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease' 2>/dev/null || true)
          if [[ "$published" != false ]]; then
            echo "::error::$IMAGE@$DIGEST runs $version, and $tag is not a published release"
            exit 1
          fi
          released=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [[ ! "$released" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::there is no tag $tag to compare the node's code with"
            exit 1
          fi
          # What the node is built from, and each path's git object at a
          # commit, or none.
          paths=(src vendor Cargo.toml Cargo.lock build.rs rust-toolchain rust-toolchain.toml .cargo)
          node_code() {
            local path
            for path in "${paths[@]}"; do
              echo "$path $(git rev-parse -q --verify "$1:$path" || echo none)"
            done
          }
          changes=$(git diff --stat "$released" "$COMMIT" -- "${paths[@]}")
          fingerprint=$({ node_code "$released"; node_code "$COMMIT"; } | sha256sum | cut -d' ' -f1)
          {
            echo "- $IMAGE@$DIGEST runs $version, the published release $tag."
            echo "- The node's code (${paths[*]}) from $tag ($released) to $COMMIT, which the image's node is built from (node_code $fingerprint):"
            echo ''
            echo '```'
            echo "${changes:-no change}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$WITHDRAW" != true && "$(node_code "$released")" != "$(node_code "$COMMIT")" && "$NODE_CODE" != "$fingerprint" ]]; then
            echo "::error::the node's code changed from $tag to $COMMIT (${changes##*$'\n' }), which the summary lists, and node_code doesn't name that change: once it is reviewed, run this workflow again with -f node_code=$fingerprint"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A withdrawal takes :latest back to an image it held before. Either
      # an earlier Latest run from main moved :latest to the digest, which
      # leads that run's title (run-name above) and which "Check the digest"
      # tied to the commit; or the digest is the image of a v*+ds.* tag on
      # the commit whose Release run succeeded, latest job included. That
      # run moved :latest to the digest the commit's Build run recorded, so
      # the digest is that one while the record is kept, or the tag's line
      # in docker/release-images names it, as RECORD says. Once the record
      # has expired, for an image docker/release-images doesn't list, any
      # image attested as built by the push of the commit to main is taken,
      # the images a run without withdraw would take, and the summary says
      # so. Without withdraw, the latest job refuses any move back.
      - name: Check a withdrawal goes back to an image latest had
        env:
          RECORD: ${{ steps.digest.outputs.record }}
        run: |
          if [[ "$WITHDRAW" == true ]]; then
            tags=$(git tag --points-at "$COMMIT" --list 'v*+ds.*')
            releases=$(gh api -X GET "repos/$GH_REPO/actions/workflows/release.yml/runs" \
              -f head_sha="$COMMIT" -f event=push -f status=success -f per_page=100 \
              --jq '.workflow_runs[] | "\(.head_branch) \(.id)"')
            moved=$(gh api -X GET "repos/$GH_REPO/actions/workflows/latest.yml/runs" \
              -f branch=main -f event=workflow_dispatch -f status=success -f per_page=100 \
              --jq '.workflow_runs[] | "\(.id) \(.display_title)"')
            by_latest=""
            while read -r run title; do
              if [[ "$title" == "Point latest at $DIGEST"* || "$title" == "Withdraw latest to $DIGEST"* ]]; then
                by_latest="the image Latest run $run moved the latest tag to"
                break
              fi
            done <<<"$moved"
            by_release=""
            while read -r tag run; do
              if [[ -n "$tag" ]] && grep -qxF -- "$tag" <<<"$tags"; then
                by_release="the image of $tag, whose Release run $run succeeded"
                break
              fi
            done <<<"$releases"
            held=${by_latest:-$by_release}
            if [[ -z "$held" ]]; then
              echo "::error::withdraw is set, but the latest tag never had $DIGEST: no earlier Latest run from main moved it there, and $COMMIT is not the commit of a v*+ds.* tag whose Release run succeeded"
              exit 1
            fi
            {
              echo "- A withdrawal, to $held."
              if [[ -z "$by_latest" && "$RECORD" == attestation ]]; then
                echo "- The Build run's record of the digest that Release run moved the latest tag to has expired, and docker/release-images doesn't list it: any image attested as built by the push of $COMMIT to main is taken, by any Build run of that push, not tied to Build run $RUN."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # For a withdrawal, the images :latest held with the image's node
      # since that node's release, oldest first, for the latest job's check
      # that a withdrawal to the same node goes back one image, never
      # further. The node's newest successful Release run put its release's
      # own image on :latest, named "release:" and its tag's commit, as the
      # image of that commit is its record. Then each successful Latest run
      # from main started after it, in the order they started (they share
      # one concurrency group): a run without withdraw adds the image its
      # title names, unless it is the newest already, and a withdrawal goes
      # back to it, dropping the images after it, or, for an image not
      # among them, leaves it alone, with nothing known before it. A
      # release's Release run moving :latest to a newer node in between is
      # not read: a withdrawal back to this node drops what came after.
      # With no successful Release run of the node, nothing is known, and
      # the latest job refuses a withdrawal to the same node.
      - name: Read the images latest held with the image's node
        id: held
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          held=""
          if [[ "$WITHDRAW" == true ]]; then
            tag="v${VERSION#ant-node }"
            released=$(git rev-parse -q --verify "refs/tags/$tag^{commit}")
            since=$(gh api --paginate -X GET "repos/$GH_REPO/actions/workflows/release.yml/runs" \
              -f head_sha="$released" -f event=push -f status=success -f per_page=100 \
              --jq '.workflow_runs[] | "\(.head_branch) \(.run_started_at)"' | awk -v tag="$tag" '$1 == tag { print $2 }' | sort | tail -n 1)
            if [[ -n "$since" ]]; then
              stack=("release:$released")
              runs=$(gh api --paginate -X GET "repos/$GH_REPO/actions/workflows/latest.yml/runs" \
                -f event=workflow_dispatch -f branch=main -f status=success -f per_page=100 \
                --jq '.workflow_runs[] | "\(.run_started_at) \(.display_title)"' | sort)
              while read -r started kind _ _ digest _; do
                if [[ ! "$started" > "$since" || ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  continue
                fi
                if [[ "$kind" == Point && "${stack[${#stack[@]}-1]}" != "$digest" ]]; then
                  stack+=("$digest")
                elif [[ "$kind" == Withdraw ]]; then
                  at=-1
                  for i in "${!stack[@]}"; do
                    if [[ "${stack[$i]}" == "$digest" ]]; then
                      at=$i
                    fi
                  done
                  if ((at >= 0)); then
                    stack=("${stack[@]:0:at+1}")
                  else
                    stack=("$digest")
                  fi
                fi
              done <<<"$runs"
              held="${stack[*]}"
            fi
            echo "- The images the latest tag held with $VERSION since its Release run, oldest first: ${held:-not known, as $tag has no successful Release run}." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"

  # Moves the tag once the run is approved: the only job here that can write
  # to the registry, and the only one that names :latest.
  latest:
    needs: checks
    runs-on: ubuntu-24.04
    environment: latest
    permissions:
      attestations: read
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/project-dspace/storage-node
      COMMIT: ${{ inputs.commit }}
      DIGEST: ${{ inputs.digest }}
      WITHDRAW: ${{ inputs.withdraw }}
      RUN: ${{ needs.checks.outputs.run }}
      VERSION: ${{ needs.checks.outputs.version }}
      HELD: ${{ needs.checks.outputs.held }}
      ALLOW_UNMARKED: ${{ inputs.allow_unmarked }}
    steps:
      - name: Log in to the registry
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # A newer node goes to :latest only with its release (release.yml), so
      # the image's node must be the one :latest has, or, in a withdrawal,
      # may be older. Versions are ordered as nodes order them: by X.Y.Z,
      # then by the +ds. build number, a version with none coming before
      # ds.1; any other form is refused. Unless the run is a withdrawal, the
      # image must also be built from the commit :latest's image was built
      # from, or a later one: the commit its image marker
      # (/opt/ant/image-version) names, which every image with darwin-nodes
      # as its node manager carries, or, for an image with none, which only
      # a release put on :latest, the commit of that release's tag. A move
      # from an image with a marker to one with none, whose node manager is
      # Autonomi's (it deletes a node's data when its disk runs low, with no
      # possession check), is refused unless the run is a withdrawal and
      # allow_unmarked is set: only withdrawing the first image release
      # needs that. A withdrawal to an
      # older node goes ahead only once the withdrawn release, the one
      # :latest's node belongs to, is deleted (or a draft or a pre-release),
      # so nodes still waiting to install it drop it and its Release run
      # can't move :latest to it again; any other answer from GitHub
      # refuses it. It goes back to the release before, never further: once
      # the withdrawn release is left out, no published release (not a
      # draft or a pre-release) may be newer than the image's, ordered as
      # nodes order them. A withdrawal to the same node (an image release
      # going back) keeps that release published, and goes back one image:
      # :latest's image must be the newest of the images the checks job
      # read it held with that node, and the new one the image before it, or,
      # when that is the release's own image, an image of its tag's commit.
      # A floor from the root switch on (no withdrawal below the root
      # release) is to be its own check once that release exists. The image's node
      # must still be a published release: the checks job checked it before
      # the approval, and a release can be withdrawn while a run waits for
      # it. Then, before :latest moves, the summary names the digest it had
      # and the one it gets, and, when the image it had has a record that
      # doesn't expire, the command that moves it back: its attestation, or
      # its line in docker/release-images as main had it when the run was
      # dispatched, with allow_unmarked when the image before has no marker
      # and the new one has one. Without one, a withdrawal to that image is refused once
      # its Build run's storage-node-digest artifact has expired, and the
      # summary says so.
      - name: Check the image against latest's, and write the summary
        run: |
          current=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ ! "$current" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::$IMAGE:latest has no digest that can be read ('$current')"
            exit 1
          fi
          current_version=$(docker run --rm --entrypoint /opt/ant/ant-node "$IMAGE@$current" --version)
          if ! order=$(jq -rn --arg new "$VERSION" --arg current "$current_version" '
              def node_version:
                capture("^ant-node (?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(\\+ds\\.(?<build>[1-9][0-9]*))?$")
                  // error("not ant-node X.Y.Z or X.Y.Z+ds.N: \(.)")
                | [.major, .minor, .patch, (.build // "0")] | map(tonumber);
              ($new | node_version) as $n | ($current | node_version) as $c
              | if $n > $c then "newer than" elif $n == $c then "the same as" else "older than" end'); then
            echo "::error::'$VERSION' and $IMAGE:latest's '$current_version' can't be ordered"
            exit 1
          fi
          if [[ "$order" == "newer than" ]]; then
            echo "::error::$IMAGE@$DIGEST runs $VERSION, newer than $IMAGE:latest's $current_version: a newer node goes to :latest only with its release"
            exit 1
          fi
          if [[ "$order" == "older than" && "$WITHDRAW" != true ]]; then
            echo "::error::$IMAGE@$DIGEST runs $VERSION, older than $IMAGE:latest's $current_version: only a withdrawal (withdraw) may move it back"
            exit 1
          fi
          withdrawn=""
          if [[ "$order" == "older than" && "$WITHDRAW" == true ]]; then
            withdrawn="v${current_version#ant-node }"
            if ! withdrawn_state=$(gh api "repos/$GH_REPO/releases/tags/$withdrawn" \
                --jq 'if .draft or .prerelease then "a draft or a pre-release" else "published" end' 2>"$RUNNER_TEMP/withdrawn.err"); then
              withdrawn_state="not known to be gone ($(tr -s '\n' ' ' <"$RUNNER_TEMP/withdrawn.err"))"
              if grep -qF 'HTTP 404' "$RUNNER_TEMP/withdrawn.err"; then
                withdrawn_state=deleted
              fi
            fi
            if [[ "$withdrawn_state" != deleted && "$withdrawn_state" != "a draft or a pre-release" ]]; then
              echo "::error::this withdrawal takes $IMAGE:latest back from $current_version, whose release $withdrawn is $withdrawn_state: delete the withdrawn release $withdrawn first, so nodes still waiting to install it drop it and its Release run can't move the latest tag to it again, then run this again"
              exit 1
            fi
          fi
          marker=$(docker run --rm --entrypoint cat "$IMAGE@$current" /opt/ant/image-version 2>/dev/null || true)
          if [[ "$marker" =~ ^[0-9a-f]{40}$ ]]; then
            base=$marker
            built="built from $marker"
          else
            base=$(gh api "repos/$GH_REPO/commits/refs/tags/v${current_version#ant-node }" --jq .sha 2>/dev/null || true)
            built="with no image marker: release v${current_version#ant-node }'s image, from ${base:-a commit not found}"
          fi
          target_marker=$(docker run --rm --entrypoint cat "$IMAGE@$DIGEST" /opt/ant/image-version 2>/dev/null || true)
          if [[ "$marker" =~ ^[0-9a-f]{40}$ && ! "$target_marker" =~ ^[0-9a-f]{40}$ ]] && ! [[ "$ALLOW_UNMARKED" == true && "$WITHDRAW" == true ]]; then
            echo "::error::$IMAGE@$DIGEST has no image marker, so its node manager is Autonomi's, which deletes a node's data when its disk runs low, and $IMAGE:latest's image has one: only withdrawing the first image release goes back to such an image, with -f withdraw=true -f allow_unmarked=true (allow_unmarked works only with withdraw=true)"
            exit 1
          fi
          release="v${VERSION#ant-node }"
          published_now=$(gh release view "$release" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease' 2>/dev/null || true)
          if [[ "$published_now" != false ]]; then
            echo "::error::$IMAGE@$DIGEST runs $VERSION, and $release is no longer a published release: it was deleted, or made a draft or a pre-release, after this run's checks"
            exit 1
          fi
          if [[ -n "$withdrawn" && "$order" == "older than" ]]; then
            if ! published_releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'); then
              echo "::error::the published releases can't be listed, to check that $release is the newest once $withdrawn is gone"
              exit 1
            fi
            if ! newer=$(jq -rRn --arg target "$release" --arg withdrawn "$withdrawn" '
                def node_version:
                  capture("^ant-node (?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(\\+ds\\.(?<build>[1-9][0-9]*))?$")
                    // error("not ant-node X.Y.Z or X.Y.Z+ds.N: \(.)")
                  | [.major, .minor, .patch, (.build // "0")] | map(tonumber);
                ("ant-node " + ($target | ltrimstr("v")) | node_version) as $t
                | [inputs | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+(\\+ds\\.[1-9][0-9]*)?$") and . != $withdrawn)
                    | select(("ant-node " + ltrimstr("v") | node_version) > $t)] | join(" ")' <<<"$published_releases"); then
              echo "::error::the published releases can't be ordered against $release"
              exit 1
            fi
            if [[ -n "$newer" ]]; then
              echo "::error::a withdrawal goes back to the release before the withdrawn one, never further: with $withdrawn gone, $newer is still published and newer than $release, which $IMAGE@$DIGEST runs. Withdraw to the newest published release's image instead"
              exit 1
            fi
          fi
          if [[ "$order" == "the same as" && "$WITHDRAW" == true ]]; then
            read -ra held <<<"$HELD"
            n=${#held[@]}
            before=""
            if ((n >= 2)) && [[ "${held[n-1]}" == "$current" ]]; then
              before=${held[n-2]}
            fi
            if [[ "$before" != "$DIGEST" && "$before" != "release:$COMMIT" ]]; then
              echo "::error::a withdrawal to the same node goes back one image, never further: to the image the latest tag had before $current, which is ${before:-not known}, and $DIGEST from $COMMIT is not it. The images it held with $VERSION since its release, oldest first (release: names the release's own image, by its tag's commit): ${HELD:-not known}"
              exit 1
            fi
          fi
          relation=""
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            relation=$(gh api "repos/$GH_REPO/compare/$base...$COMMIT" --jq .status 2>/dev/null || true)
          fi
          if [[ "$relation" != ahead && "$relation" != identical && "$WITHDRAW" != true ]]; then
            echo "::error::$COMMIT is not the commit of $IMAGE:latest's image (${base:-not found}) or a later one (${relation:-not compared}): only a withdrawal (withdraw) may move it back"
            exit 1
          fi
          lasting=""
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            attested=$(gh attestation verify "oci://$IMAGE@$current" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/build.yml" \
              --source-ref refs/heads/main --source-digest "$base" --format json \
              --jq '[.[].verificationResult.signature.certificate | select(.buildTrigger == "push") | .runInvocationURI] | first // empty' || true)
            listed=$(gh api "repos/$GH_REPO/contents/docker/release-images?ref=$GITHUB_SHA" -H 'Accept: application/vnd.github.raw+json' || true)
            if [[ -n "$attested" ]]; then
              lasting="its attestation"
            elif awk -v base="$base" -v current="$current" '!/^#/ && NF == 3 && $2 == base && $3 == current { found = 1 } END { exit !found }' <<<"$listed"; then
              lasting="its line in docker/release-images"
            fi
          fi
          echo "Moving $IMAGE:latest from $current to $DIGEST." >> "$GITHUB_STEP_SUMMARY"
          {
            echo "- $current runs $current_version, $built."
            echo "- $DIGEST runs $VERSION, $order the image before, built from $COMMIT by Build run $RUN."
            echo "- $COMMIT against ${base:-no commit found}, the commit of the image before: ${relation:-not compared}."
            if [[ "$WITHDRAW" == true ]]; then
              echo "- A withdrawal: withdraw is set, so the new image may be older than the one before, and its node too."
            fi
            echo "- $VERSION is still the published release $release."
            if [[ "$order" == "older than" ]]; then
              echo "- With $withdrawn gone, $release is the newest published release: the withdrawal goes back to the release before, no further."
            fi
            if [[ "$WITHDRAW" == true && "$order" == "the same as" ]]; then
              echo "- A withdrawal to the same node, back one image: from $current, the newest image the latest tag held with $VERSION, to the one before it (${before})."
            fi
            if [[ -n "$withdrawn" ]]; then
              echo "- The withdrawn release $withdrawn, of $current_version, is $withdrawn_state: nodes still waiting to install it drop it, and its Release run can't move the latest tag to it again."
            fi
            if [[ "$marker" =~ ^[0-9a-f]{40}$ && ! "$target_marker" =~ ^[0-9a-f]{40}$ ]]; then
              echo "- **allow_unmarked is set: the latest tag goes from an image with darwin-nodes as its node manager to one with none, whose node manager is Autonomi's.**"
            fi
            if [[ -n "$lasting" ]]; then
              back=""
              if [[ ! "$marker" =~ ^[0-9a-f]{40}$ && "$target_marker" =~ ^[0-9a-f]{40}$ ]]; then
                back=" -f allow_unmarked=true"
              fi
              echo "- To move it back (the image before is recorded for good by $lasting): \`gh workflow run latest.yml --ref main -f commit=$base -f digest=$current -f withdraw=true$back\`"
              if [[ -n "$back" ]]; then
                echo "- The command sets allow_unmarked: the image before has no image marker, so its node manager is Autonomi's, and $DIGEST has one."
              fi
            elif [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
              echo "- $current has no record that doesn't expire: no attestation from the push of $base to main, and no line in docker/release-images. A withdrawal to it is refused once its Build run's storage-node-digest artifact has expired, 30 days after that run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # --prefer-index=false copies the manifest as it is, so :latest has the
      # same digest as the image it names, as in release.yml's latest job.
      - name: Point latest at it
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          now=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ "$now" != "$DIGEST" ]]; then
            echo "::error::$IMAGE:latest is $now, not $DIGEST"
            exit 1
          fi
          echo "- $IMAGE:latest is now $DIGEST." | tee -a "$GITHUB_STEP_SUMMARY"
