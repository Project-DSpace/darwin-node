# Builds, signs and publishes the Linux x86_64 release that running nodes
# install by themselves (src/upgrade/), the way Autonomi releases ant-node,
# cut down to our one platform. Runs when a person pushes a version tag:
#
#   git tag -a v0.21.0+ds.2 -m v0.21.0+ds.2 && git push origin v0.21.0+ds.2
#
# Versions are <upstream base>+ds.<build>: nodes order build metadata, so
# 0.21.0 < 0.21.0+ds.1 < 0.21.0+ds.2 < 0.21.1 < 0.21.1+ds.1. Bump Cargo.toml
# (and Cargo.lock's ant-node entry) with every node code change, then tag it:
# a running node only takes a release whose version is higher than its own.
#
# The tag has to come from a person: GitHub won't let GITHUB_TOKEN create a tag
# on a commit that changes .github/workflows, so this only publishes an
# existing tag. The signing key is the RELEASE_SIGNING_KEY_HEX secret of the
# `release` environment, which only v*+ds.* tags can use.
#
# Nothing is published until the checks job has seen the tagged commit pass
# both other workflows: its newest Test run (from the push to main, or one
# run by hand without the listings cross-test) and the Build run from its
# push to main, waited for if they are still going. The release
# environment's approval is asked for only after that.
# scripts/check-workflows.sh, which the Build and Test workflows run, fails
# if this file loses that order.
#
# Once the release is published, the latest job points the storage-node
# image's :latest, which home operators run, at the image the Build workflow
# made from the tagged commit when it was pushed to main. Nothing else moves
# :latest, so it only ever follows an approved, signed release.

name: Release

on:
  push:
    tags: ['v*\+ds.*']

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # The servers' Ubuntu release: a binary built against a newer glibc will
    # not start on an older one, and nothing rolls a node back if it can't.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A tag that differs from the version compiled into the binary would make
      # every node reinstall the release over and over.
      - name: Check tag, version and release key
        id: check
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+ds\.[1-9][0-9]*$ ]]; then
            echo "::error::$tag is not vX.Y.Z+ds.N"
            exit 1
          fi
          version="${tag#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Cargo.toml has $cargo_version, the tag is $tag"
            exit 1
          fi
          # The key compiled into the node must be the published public key.
          sed -n '/^const RELEASE_SIGNING_KEY/,/^];/p' src/upgrade/signature.rs \
            | grep -oE '0x[0-9a-f]{2}' | sed 's/0x//' | tr -d '\n' | xxd -r -p > "$RUNNER_TEMP/embedded.pub"
          if ! cmp -s "$RUNNER_TEMP/embedded.pub" sign/release-signing-key.pub; then
            echo "::error::RELEASE_SIGNING_KEY in src/upgrade/signature.rs is not sign/release-signing-key.pub"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Upstream's step (their #243), run for our one target, the runner's own.
      # Collects, unaltered, the licence, copyright and notice files of every
      # crate the build resolves, including build-time tools, and fails if any
      # crate's licence is outside the policy or its texts cannot be found (see
      # the script and its config). Unlike upstream's, our release links
      # self_encryption (GPL-3.0 with a linking exception), through
      # vendor/ant-listings; the config's [exception.self_encryption] covers
      # it. build.yml runs the same check on every push to main, so a gap
      # shows there before a tag. The token raises the GitHub rate limit for
      # licence files fetched from crates' repositories.
      - name: Generate THIRD-PARTY-NOTICES.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/third_party_notices/generate.py
          --config scripts/third_party_notices/config.toml
          --output THIRD-PARTY-NOTICES.txt
          --target x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --locked --bin ant-node

      # The test seams (src/test_seams.rs), which let a test make a node's
      # disk read as full, are compiled only with the test-utils feature: the
      # binary nodes install must hold none of their variables. Checked here,
      # before the binary is packaged and signed.
      - name: Check the test seams are left out
        run: |
          if [[ ! -s target/release/ant-node ]]; then
            echo "::error::there is no target/release/ant-node to check"
            exit 1
          fi
          if grep -aqF ANT_TEST_SEAM_ target/release/ant-node; then
            echo "::error::target/release/ant-node holds a test seam (ANT_TEST_SEAM_*): it was built with test-utils"
            exit 1
          fi

      # What a node runs to see whether a sibling already installed the upgrade.
      - name: Check the binary's version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          reported=$(target/release/ant-node --version)
          if [[ "$reported" != "ant-node $VERSION" ]]; then
            echo "::error::the binary reports '$reported'"
            exit 1
          fi

      # Same name and layout as Autonomi's release: nodes find the archive by
      # "linux-x64" and take the file named ant-node out of it. As in
      # Autonomi's archives, it also carries the project's licence files, the
      # third-party notices and the Rust standard library's notices from the
      # toolchain that built the binary; whatever installs a release extracts
      # only ant-node, so the extra files do not affect upgrades.
      - name: Package
        run: |
          mkdir dist
          cp target/release/ant-node config/bootstrap_peers.toml LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt dist/
          cp "$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html" dist/RUST-STD-COPYRIGHT.html
          tar -C dist -czf ant-node-cli-linux-x64.tar.gz ant-node bootstrap_peers.toml \
            LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt RUST-STD-COPYRIGHT.html
          cp sign/release-signing-key.pub .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-unsigned
          path: |
            ant-node-cli-linux-x64.tar.gz
            release-signing-key.pub
          if-no-files-found: error
          retention-days: 1

  # The tagged commit must have passed the Test and Build workflows. Runs
  # alongside the build job; publish needs both. Test cancels a run in
  # progress when the same ref is pushed again, so a cancelled run fails this
  # job: re-run it, then this job. The Build run found here is the one the
  # latest job takes the image from.
  checks:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      build_run: ${{ steps.build_run.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The newest run of this commit's suite alone: from its push to main,
      # or one run by hand without the listings cross-test (Test has no way
      # to reuse another run). test.yml names a run by hand for whether it
      # runs the cross-test, which also tests darwin-client, so a later run
      # with it can't take the place of a green run of the suite.
      - name: Wait for the Test workflow's run of this commit
        run: |
          run=$(gh api -X GET "repos/$GH_REPO/actions/workflows/test.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f per_page=100 \
            --jq '[.workflow_runs[] | select((.event == "push" and .head_branch == "main") or (.event == "workflow_dispatch" and .display_title == "Test by hand"))] | max_by(.run_number) | .id // empty')
          if [[ -z "$run" ]]; then
            echo "::error::no Test run of $GITHUB_SHA from a push to main, or by hand without the listings cross-test: run Test on it, then this job"
            exit 1
          fi
          echo "Test run $run"
          gh run watch "$run" --exit-status --interval 60 > /dev/null || true
          conclusion=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.conclusion // empty')
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Test run $run of $GITHUB_SHA ended '${conclusion:-unfinished}', not success: re-run it, then this job"
            exit 1
          fi

      # Only a push run built the node binary from this commit itself; one
      # run by hand may reuse another run's.
      - name: Wait for the Build workflow's run of this commit
        id: build_run
        run: |
          run=$(gh api -X GET "repos/$GH_REPO/actions/workflows/build.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f branch=main -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')
          if [[ -z "$run" ]]; then
            echo "::error::no Build run from a push of $GITHUB_SHA to main: tag a commit that Build ran for on main"
            exit 1
          fi
          echo "Build run $run"
          gh run watch "$run" --exit-status --interval 60 > /dev/null || true
          conclusion=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq '.conclusion // empty')
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Build run $run of $GITHUB_SHA ended '${conclusion:-unfinished}', not success: re-run it, then this job"
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, checks]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-unsigned

      - name: Install ant-keygen 0.1.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ant-keygen.tar.gz" \
            https://github.com/WithAutonomi/ant-keygen/releases/download/v0.1.0/ant-keygen-linux-x64.tar.gz
          echo "1e81922c3b3d383db0bb8039d6f13363de013b64f80e50280798461ce9e8fcf0  $RUNNER_TEMP/ant-keygen.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ant-keygen.tar.gz" -C "$RUNNER_TEMP" ant-keygen

      - name: Sign
        env:
          SIGNING_KEY_HEX: ${{ secrets.RELEASE_SIGNING_KEY_HEX }}
        run: |
          umask 077
          keygen="$RUNNER_TEMP/ant-keygen"
          key="$RUNNER_TEMP/release.secret"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SIGNING_KEY_HEX" | "$keygen" verify-key > /dev/null
          printf '%s' "$SIGNING_KEY_HEX" | xxd -r -p > "$key"
          "$keygen" sign --key "$key" \
            --input ant-node-cli-linux-x64.tar.gz --output ant-node-cli-linux-x64.tar.gz.sig
          # The check a node makes, with the key compiled into this release.
          "$keygen" verify --key release-signing-key.pub \
            --input ant-node-cli-linux-x64.tar.gz --signature ant-node-cli-linux-x64.tar.gz.sig
          sha256sum ant-node-cli-linux-x64.tar.gz ant-node-cli-linux-x64.tar.gz.sig > SHA256SUMS.txt

      # Nodes fail to read the whole release list if any release has no title
      # or no notes, so both are always set.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' \
            "Storage node $TAG for Linux x86_64 (Ubuntu 24.04 or newer)." \
            "" \
            "Running nodes install it by themselves within the staged-rollout window." \
            "The archive is signed with ML-DSA-65; check it with:" \
            "ant-keygen verify --key release-signing-key.pub --input ant-node-cli-linux-x64.tar.gz --signature ant-node-cli-linux-x64.tar.gz.sig" \
            "" \
            "The archive also contains LICENSE-MIT and LICENSE-APACHE, plus THIRD-PARTY-NOTICES.txt and RUST-STD-COPYRIGHT.html with the licences and copyright notices of the third-party code in the binary and of the tools used to build it." \
            > notes.md
          gh release create "$TAG" --verify-tag --latest \
            --title "Storage node $TAG" --notes-file notes.md \
            ant-node-cli-linux-x64.tar.gz ant-node-cli-linux-x64.tar.gz.sig \
            SHA256SUMS.txt release-signing-key.pub

  # Points :latest at the image the Build workflow made from this commit. A
  # job of its own, after the approved publish, so it holds no signing key and
  # can be re-run alone. The image is the one that run smoke-tested and pushed
  # as :<commit>, found by the digest the run recorded, so a later run pushing
  # the same commit tag can't change what :latest gets. The run is the one the
  # checks job waited for: from the push of this commit to main, and green.
  latest:
    needs: [build, checks, publish]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/project-dspace/storage-node
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Re-running an older release's job must not move :latest back.
      - name: Check this is the latest release
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          if [[ "$latest" != "$TAG" ]]; then
            echo "::error::$TAG is not the latest release ($latest is); :latest is left as it is"
            exit 1
          fi

      - name: Read the image's digest
        id: image
        env:
          RUN: ${{ needs.checks.outputs.build_run }}
        run: |
          if ! gh run download "$RUN" --name storage-node-digest --dir "$RUNNER_TEMP/digest"; then
            echo "::error::Build run $RUN has no storage-node-digest artifact (expired?): re-run it, then this job"
            exit 1
          fi
          digest=$(cat "$RUNNER_TEMP/digest/storage-node-digest.txt")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build run $RUN recorded '$digest', not a digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # The image's node must be this release's.
      - name: Check the image's node version
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          reported=$(docker run --rm --entrypoint /opt/ant/ant-node "$IMAGE@$DIGEST" --version)
          if [[ "$reported" != "ant-node $VERSION" ]]; then
            echo "::error::$IMAGE@$DIGEST has '$reported', not ant-node $VERSION"
            exit 1
          fi

      # --prefer-index=false copies the manifest as it is, so :latest has the
      # same digest as the image it names (by default imagetools wraps a
      # single image in a new index, with a digest of its own).
      - name: Point latest at it
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          RUN: ${{ needs.checks.outputs.build_run }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          now=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ "$now" != "$DIGEST" ]]; then
            echo "::error::$IMAGE:latest is $now, not $DIGEST"
            exit 1
          fi
          echo "$IMAGE:latest is now $DIGEST: $TAG, from Build run $RUN" | tee -a "$GITHUB_STEP_SUMMARY"
