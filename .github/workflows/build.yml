# Builds the Linux node binary on every push to main, and the image's node
# manager from the darwin-client commit docker/manager-revision pins, packages
# them as the storage-node Docker image (run by home operators and our
# servers), tests the image on an isolated network and publishes it as
# :<commit>. Also checks that the third-party notices a release ships can be
# generated.
#
# It never publishes :latest, which home operators run: release.yml points
# :latest at the image a push run here made from a release's commit, once that
# release is approved and published. Each run records the digest it pushed
# (the storage-node-digest artifact) for that.
#
# Replaces upstream's workflows, which run Autonomi's test matrix, PR checks
# and multi-platform releases.
#
# Run by hand with `reuse_build` set to an earlier run's ID to test image
# changes against that run's node binary instead of rebuilding it. The image
# takes its licence and notice files from that build too, so builds from
# before they were packaged with the binary can't be reused. The node
# manager is built in every run, from the pin in the run's own commit.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reuse_build:
        description: Run ID whose ant-node build to reuse (empty = build)
        required: false
        default: ""

permissions:
  contents: read

# A newer run for the same branch replaces an older one, so an older build
# can never publish after a newer one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Generates THIRD-PARTY-NOTICES.txt for the release target, as release.yml
  # does, so a dependency change that leaves a gap (a licence outside the
  # policy, a missing licence text, possible native code with no reviewed
  # entry in scripts/third_party_notices/config.toml) fails here within
  # minutes, not when a release is tagged. Needs only Python and cargo's view
  # of the dependency graph, no build.
  notices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The workflow files keep what releases rely on: only these three
      # workflows, every action pinned to a commit, and release.yml's tags,
      # permissions, key check and the checks its publish waits for (see the
      # script).
      - name: Check the workflows
        shell: bash
        run: bash scripts/check-workflows.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The token raises the GitHub rate limit for licence files fetched from
      # crates' repositories.
      - name: Generate THIRD-PARTY-NOTICES.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/third_party_notices/generate.py
          --config scripts/third_party_notices/config.toml
          --output THIRD-PARTY-NOTICES.txt
          --target x86_64-unknown-linux-gnu

      # vendor/ant-listings is darwin-listings 0.3.1 (tag v0.3.1, commit 84787fe)
      # unchanged, as the notices and vendor/ant-listings/VENDORED.md say: its
      # src tree and Cargo.toml are the git objects that file records.
      - name: Check the vendored ant-listings
        shell: bash
        run: |
          for object in "src tree" "Cargo.toml blob"; do
            path="vendor/ant-listings/${object% *}"
            recorded=$(sed -n "s/^- $object: \([0-9a-f]\{40\}\)\$/\1/p" vendor/ant-listings/VENDORED.md)
            actual=$(git rev-parse "HEAD:$path")
            if [[ -z "$recorded" || "$actual" != "$recorded" ]]; then
              echo "::error::$path is $actual; vendor/ant-listings/VENDORED.md records ${recorded:-none}"
              exit 1
            fi
          done

  linux-x64:
    if: ${{ !inputs.reuse_build }}
    # Pinned to the servers' Ubuntu release: a binary built against a newer
    # glibc will not run on an older one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The same notices as a release's (see the notices job), for the image.
      - name: Generate THIRD-PARTY-NOTICES.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/third_party_notices/generate.py
          --config scripts/third_party_notices/config.toml
          --output THIRD-PARTY-NOTICES.txt
          --target x86_64-unknown-linux-gnu

      # The key compiled into the node must be the published public key, which
      # release.yml checks for every tag. Checked here too, with the published
      # key's digest (tests/fork_pins.rs pins the same), so an image built from
      # main can't carry another key either.
      - name: Check the release key
        shell: bash
        run: |
          echo "695bea4c91d0046dfacc48edc293584485b242d30ba534bb61eebb485ce97288  sign/release-signing-key.pub" \
            | sha256sum -c --quiet - \
            || { echo "::error::sign/release-signing-key.pub is not the release key"; exit 1; }
          sed -n '/^const RELEASE_SIGNING_KEY/,/^];/p' src/upgrade/signature.rs \
            | grep -oE '0x[0-9a-f]{2}' | sed 's/0x//' | tr -d '\n' | xxd -r -p > "$RUNNER_TEMP/embedded.pub"
          if ! cmp -s "$RUNNER_TEMP/embedded.pub" sign/release-signing-key.pub; then
            echo "::error::RELEASE_SIGNING_KEY in src/upgrade/signature.rs is not sign/release-signing-key.pub"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --bin ant-node

      # The image hands every node its payment settings in these variables
      # (docker/Dockerfile, docker/entrypoint.sh), so the binary must read them.
      - name: Check the payment variables
        shell: bash
        run: |
          help=$(target/release/ant-node --help)
          for name in ANT_EVM_RPC_URL ANT_EVM_PAYMENT_TOKEN ANT_EVM_PAYMENT_VAULT ANT_EVM_PAYMENT_VAULT_DEPLOYMENT_BLOCK; do
            if ! grep -qF "[env: $name=" <<<"$help"; then
              echo "::error::ant-node --help doesn't name $name"
              exit 1
            fi
          done

      # The test seams (src/test_seams.rs), which let a test make a node's
      # disk read as full, are compiled only with the test-utils feature: the
      # binary operators run must hold none of their variables. release.yml
      # checks the binary nodes install the same way.
      - name: Check the test seams are left out
        shell: bash
        run: |
          if [[ ! -s target/release/ant-node ]]; then
            echo "::error::there is no target/release/ant-node to check"
            exit 1
          fi
          if grep -aqF ANT_TEST_SEAM_ target/release/ant-node; then
            echo "::error::target/release/ant-node holds a test seam (ANT_TEST_SEAM_*): it was built with test-utils"
            exit 1
          fi

      # The binary and its bootstrap file, plus what the image ships in
      # /usr/share/doc/storage-node/ (docker/Dockerfile): the project's licence
      # files, the third-party notices and the Rust standard library's notices
      # from the toolchain that built the binary, as in a release archive.
      - name: Package
        run: |
          mkdir dist
          cp target/release/ant-node config/bootstrap_peers.toml LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt dist/
          cp "$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html" dist/RUST-STD-COPYRIGHT.html
          tar -C dist -czf ant-node-linux-x64.tar.gz .
          sha256sum ant-node-linux-x64.tar.gz > SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-node-linux-x64
          path: |
            ant-node-linux-x64.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # The image's node manager, darwin-nodes: built from the darwin-client
  # commit docker/manager-revision pins (darwin-client's repository on its
  # first line, the commit on its second), with that commit's own lockfile,
  # and packaged with darwin-client's licence files, the third-party notices
  # of the package it is built from and the Rust standard library's notices,
  # as the node binary is above. darwin-client's tests pin what it leaves out
  # (no reset, no download source, no log forwarding, no eviction); this job
  # checks the binary the image ships.
  #
  # The pinned commit must be on darwin-client's main: a commit only on a
  # branch is lost if that branch is squashed or rebased into main, and
  # GitHub stops serving it once it is garbage-collected. A darwin-client
  # change the image needs therefore lands on darwin-client's main first,
  # merged with its commits kept; then docker/manager-revision and
  # docker/NOTICE name the commit as it is there, in one darwin-node commit.
  manager:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # main's whole history without file contents (a blobless fetch), to
      # check the pin is on it; the checkout then fetches the pinned
      # commit's files.
      - name: Check out the pinned darwin-client
        shell: bash
        run: |
          { read -r repository; read -r revision; } < docker/manager-revision
          if [[ "$repository" != https://github.com/Project-DSpace/darwin-client.git || ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::docker/manager-revision must name darwin-client's repository, then a full commit"
            exit 1
          fi
          git init -q darwin-client
          git -C darwin-client remote add origin "$repository"
          git -C darwin-client fetch -q --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main
          if ! git -C darwin-client merge-base --is-ancestor "$revision" refs/remotes/origin/main; then
            echo "::error::docker/manager-revision pins $revision, which is not on darwin-client's main: land it there, merged with its commits kept, then pin the commit as it is on main"
            exit 1
          fi
          git -C darwin-client checkout -q "$revision"
          echo "REVISION=$revision" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: darwin-client -> target

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build
        working-directory: darwin-client
        run: cargo build --release --locked -p ant-cli --bin darwin-nodes

      # The binary names the pinned commit (ant-cli's build script records the
      # checkout's: 7 characters, or more where 7 would be ambiguous), and
      # holds no Autonomi download or log address and none of the reset and
      # log-forwarding routes the darwin CLI's own daemon serves.
      - name: Check the manager
        shell: bash
        working-directory: darwin-client
        run: |
          version=$(target/release/darwin-nodes --version)
          echo "$version"
          commit=${version##*commit }
          if [[ ! "$commit" =~ ^[0-9a-f]{7,40}$ || "$REVISION" != "$commit"* ]]; then
            echo "::error::darwin-nodes --version doesn't name commit $REVISION: ${version//$'\n'/; }"
            exit 1
          fi
          for text in WithAutonomi logs.autonomi.com /api/v1/reset /api/v1/logs/forward; do
            if grep -aqF "$text" target/release/darwin-nodes; then
              echo "::error::target/release/darwin-nodes holds $text"
              exit 1
            fi
          done

      # darwin-client's own generator and policy, for the package the binary
      # is built from (see the notices job for what it checks).
      - name: Generate THIRD-PARTY-NOTICES.txt
        working-directory: darwin-client
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/third_party_notices/generate.py
          --package ant-cli
          --target x86_64-unknown-linux-gnu
          --config scripts/third_party_notices/config.toml
          --output THIRD-PARTY-NOTICES.txt

      - name: Package
        working-directory: darwin-client
        run: |
          mkdir dist
          cp target/release/darwin-nodes LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt dist/
          cp "$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html" dist/RUST-STD-COPYRIGHT.html
          tar -C dist -czf ../darwin-nodes-linux-x64.tar.gz .

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darwin-nodes-linux-x64
          path: darwin-nodes-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # Packages the binaries as the Docker image, tests it on an isolated network
  # and pushes it to GitHub's container registry.
  image:
    needs: [linux-x64, manager]
    if: ${{ always() && (needs.linux-x64.result == 'success' || needs.linux-x64.result == 'skipped') && needs.manager.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/project-dspace/storage-node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ant-node-linux-x64
          run-id: ${{ inputs.reuse_build || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: darwin-nodes-linux-x64

      - name: Unpack builds
        run: |
          mkdir -p dist/darwin-nodes
          tar -xzf ant-node-linux-x64.tar.gz -C dist
          tar -xzf darwin-nodes-linux-x64.tar.gz -C dist/darwin-nodes

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # IMAGE_VERSION is the image marker the entrypoint passes to every node:
      # the commit the image is built from, as its tag.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          load: true
          build-args: IMAGE_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # Runs the image on a small isolated network (never the live one): its
      # network settings and node manager, joining, the token and vault and
      # the image marker every node gets, browser addresses, a node started
      # again on its new binary when it exits after installing an upgrade,
      # and after a crash, container restarts, taking
      # over the previous image's layout, retiring nodes and keeping their
      # data 3 days, setting unregistered folders aside for good, clean stops,
      # going back to the image before, which keeps every folder set aside, a
      # nearly full disk on which nothing is evicted or deleted and the health
      # checks keep the fields the server watchdog reads, and the move from
      # the image before (Autonomi's node manager): every node kept, and the
      # nodes it evicted dismissed once.
      - name: Smoke test
        run: bash docker/smoke-test.sh "$IMAGE:${{ github.sha }}"

      # The image as a file, for loading onto our servers without registry
      # credentials (docker load).
      - name: Save image
        run: docker save "$IMAGE:${{ github.sha }}" | gzip > storage-node-image.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-node-image
          path: storage-node-image.tar.gz
          retention-days: 30

      - name: Publish
        run: docker push "$IMAGE:${{ github.sha }}"

      # The digest this run pushed, read back from the registry. release.yml
      # copies exactly this image to :latest, so a later run that pushes the
      # same commit tag again (a reuse_build run, say) can't change what
      # :latest gets.
      - name: Record the image digest
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ github.sha }}" --format '{{json .Manifest}}' \
            | jq -r .digest > storage-node-digest.txt
          digest=$(cat storage-node-digest.txt)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest: $digest"; exit 1; }
          echo "$IMAGE:${{ github.sha }} is $digest"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-node-digest
          path: storage-node-digest.txt
          if-no-files-found: error
          retention-days: 30
