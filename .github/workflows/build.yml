# Builds the Linux node binary on every push to main, packages it as the
# storage-node Docker image (run by home operators and our servers), tests the
# image on an isolated network and publishes it. Also checks that the
# third-party notices a release ships can be generated.
#
# Replaces upstream's workflows, which run Autonomi's test matrix, PR checks
# and multi-platform releases.
#
# Run by hand with `reuse_build` set to an earlier run's ID to test image
# changes against that run's node binary instead of rebuilding it. The image
# takes its licence and notice files from that build too, so builds from
# before they were packaged with the binary can't be reused.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reuse_build:
        description: Run ID whose ant-node build to reuse (empty = build)
        required: false
        default: ""

permissions:
  contents: read

# A newer run for the same branch replaces an older one, so an older build
# can never publish after a newer one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Generates THIRD-PARTY-NOTICES.txt for the release target, as release.yml
  # does, so a dependency change that leaves a gap (a licence outside the
  # policy, a missing licence text, possible native code with no reviewed
  # entry in scripts/third_party_notices/config.toml) fails here within
  # minutes, not when a release is tagged. Needs only Python and cargo's view
  # of the dependency graph, no build.
  notices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The token raises the GitHub rate limit for licence files fetched from
      # crates' repositories.
      - name: Generate THIRD-PARTY-NOTICES.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/third_party_notices/generate.py
          --config scripts/third_party_notices/config.toml
          --output THIRD-PARTY-NOTICES.txt
          --target x86_64-unknown-linux-gnu

  linux-x64:
    if: ${{ !inputs.reuse_build }}
    # Pinned to the servers' Ubuntu release: a binary built against a newer
    # glibc will not run on an older one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The same notices as a release's (see the notices job), for the image.
      - name: Generate THIRD-PARTY-NOTICES.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/third_party_notices/generate.py
          --config scripts/third_party_notices/config.toml
          --output THIRD-PARTY-NOTICES.txt
          --target x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --locked --bin ant-node

      # The binary and its bootstrap file, plus what the image ships in
      # /usr/share/doc/storage-node/ (docker/Dockerfile): the project's licence
      # files, the third-party notices and the Rust standard library's notices
      # from the toolchain that built the binary, as in a release archive.
      - name: Package
        run: |
          mkdir dist
          cp target/release/ant-node config/bootstrap_peers.toml LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt dist/
          cp "$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html" dist/RUST-STD-COPYRIGHT.html
          tar -C dist -czf ant-node-linux-x64.tar.gz .
          sha256sum ant-node-linux-x64.tar.gz > SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-node-linux-x64
          path: |
            ant-node-linux-x64.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # Packages the binary as the Docker image, tests it on an isolated network
  # and pushes it to GitHub's container registry.
  image:
    needs: linux-x64
    if: ${{ always() && (needs.linux-x64.result == 'success' || needs.linux-x64.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/project-dspace/storage-node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ant-node-linux-x64
          run-id: ${{ inputs.reuse_build || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack build
        run: mkdir dist && tar -xzf ant-node-linux-x64.tar.gz -C dist

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # Runs the image on a small isolated network (never the live one):
      # joining, browser addresses, restarts, taking over the previous image's
      # layout, retiring nodes, clean stops and disk-pressure eviction.
      - name: Smoke test
        run: bash docker/smoke-test.sh "$IMAGE:${{ github.sha }}"

      # The image as a file, for loading onto our servers without registry
      # credentials (docker load).
      - name: Save image
        run: docker save "$IMAGE:${{ github.sha }}" | gzip > storage-node-image.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-node-image
          path: storage-node-image.tar.gz
          retention-days: 30

      - name: Publish
        run: docker push "$IMAGE:${{ github.sha }}"

      # Only main moves :latest, which home operators update from.
      - name: Publish as latest
        if: github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:latest"
