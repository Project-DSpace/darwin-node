# Runs the test suite: the library and binaries, then each integration test.
# Kept apart from build.yml so a failing test doesn't stop the image from
# being built; run it by hand and check both before tagging a release.
#
# Upstream ran these on pull requests (their ci.yml, removed in 09d41b4).
# It runs on every push to main, weekly and by hand. (While this repo was
# private, 2026-10-06 to 2026-10-13, it ran only weekly and by hand: the org's
# free plan gives private repos about 2,000 Actions minutes a month, and a run
# is long.) The EVM tests start a local Anvil chain, hence Foundry.
#
# Weekly, and by hand when asked, it also runs scripts/test_e2e_listings.sh:
# darwin-client (its main branch, or the ref given) uploading to these nodes on
# a local devnet with listings and its own Anvil chain.

name: Test

on:
  push:
    branches: [main]
  schedule:
    # Mondays, 03:23 UTC: GitHub delays or drops scheduled runs most at the
    # top of the hour.
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      listings_cross_test:
        description: Also run the listings cross-test (scripts/test_e2e_listings.sh)
        type: boolean
        default: false
      client_ref:
        description: darwin-client branch, tag or commit for the cross-test (empty = main)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Line tables only, not full debug info, so the test build fits on the
    # runner's disk (the test profile inherits dev); backtraces still give
    # file and line.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Pinned, as upstream pinned it: a new anvil can break the EVM tests
      # with no change here. v1.8.5 is the version the suite passed with.
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5

      # Private repos' 2-vCPU runners have about 14 GB free, and the test build
      # filled it: the linker died with "ld terminated with signal 7 [Bus
      # error]". This job uses none of these preinstalled toolchains.
      - name: Free disk space
        run: |
          df -h /
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [ -d "$dir" ]; then sudo rm -rf "$dir"; fi
          done
          df -h /

      - name: Build the tests
        id: build
        run: cargo test --locked --features test-utils --no-run

      - name: Disk space after the build
        if: ${{ !cancelled() }}
        run: df -h /

      - name: Library and binaries
        run: cargo test --locked --features test-utils --lib --bins

      # vendor/ant-listings' own tests, under this repository's Cargo.lock: a
      # dependency this lock resolves differently from darwin-listings' fails
      # here.
      - name: Vendored ant-listings
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ant-listings

      # Run whether or not the library tests passed, as long as the tests
      # built, and one target at a time, so every target reports even if an
      # earlier one fails. The ones upstream ran single-threaded (e2e flakes
      # on hosted runners otherwise; the disk tests measure the disk) still
      # are.
      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          shopt -s nullglob
          serial=" e2e migration_reclaims_disk migration_crash_safety storage_scale "
          failed=()
          for target in tests/*.rs tests/*/mod.rs; do
            name=${target#tests/}; name=${name%/mod.rs}; name=${name%.rs}
            args=()
            if [[ "$serial" == *" $name "* ]]; then args=(-- --test-threads=1); fi
            echo "::group::$name"
            cargo test --locked --features test-utils --test "$name" "${args[@]}" || failed+=("$name")
            echo "::endgroup::"
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error::failed: ${failed[*]}"
            exit 1
          fi

  # darwin-client against these nodes' listings, on a local devnet with its own
  # Anvil chain (scripts/test_e2e_listings.sh): envelopes, listings, records,
  # per-chunk payment, manifests, and the paid commands that are off. Weekly,
  # and by hand with listings_cross_test, not on pushes: it builds both
  # projects in release mode.
  listings-cross-test:
    if: ${{ github.event_name == 'schedule' || inputs.listings_cross_test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: darwin-node

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Project-DSpace/darwin-client
          ref: ${{ inputs.client_ref || 'main' }}
          path: darwin-client

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5

      - name: Free disk space
        run: |
          df -h /
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [ -d "$dir" ]; then sudo rm -rf "$dir"; fi
          done
          df -h /

      - name: Cross-test
        working-directory: darwin-node
        env:
          ANT_CLIENT_DIR: ${{ github.workspace }}/darwin-client
        run: bash scripts/test_e2e_listings.sh
