# Runs the test suite: the library and binaries, then each integration test.
# Kept apart from build.yml so a failing test doesn't stop the image from
# being built; run it by hand and check both before tagging a release.
#
# Upstream ran these on pull requests (their ci.yml, removed in 09d41b4).
# While this repo is private it runs weekly and by hand, not on every push:
# the org's free plan gives its private repos about 2,000 Actions minutes a
# month, which Build and Release need too, and a run is long (upstream's took
# 39 minutes on 4-vCPU runners; private repos get 2 vCPUs). Run it on pushes
# to main again once the repo is public. The EVM tests start a local Anvil
# chain, hence Foundry.

name: Test

on:
  schedule:
    # Mondays, 03:23 UTC: GitHub delays or drops scheduled runs most at the
    # top of the hour.
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pinned, as upstream pinned it: a new anvil can break the EVM tests
      # with no change here. v1.8.5 is the version the suite passed with.
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Build the tests
        id: build
        run: cargo test --locked --features test-utils --no-run

      - name: Library and binaries
        run: cargo test --locked --features test-utils --lib --bins

      # Run whether or not the library tests passed, as long as the tests
      # built, and one target at a time, so every target reports even if an
      # earlier one fails. The ones upstream ran single-threaded (e2e flakes
      # on hosted runners otherwise; the disk tests measure the disk) still
      # are.
      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          shopt -s nullglob
          serial=" e2e migration_reclaims_disk migration_crash_safety storage_scale "
          failed=()
          for target in tests/*.rs tests/*/mod.rs; do
            name=${target#tests/}; name=${name%/mod.rs}; name=${name%.rs}
            args=()
            if [[ "$serial" == *" $name "* ]]; then args=(-- --test-threads=1); fi
            echo "::group::$name"
            cargo test --locked --features test-utils --test "$name" "${args[@]}" || failed+=("$name")
            echo "::endgroup::"
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error::failed: ${failed[*]}"
            exit 1
          fi
